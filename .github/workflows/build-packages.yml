name: Build Android, Linux and Windows packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish all built packages as a GitHub Release (run from main only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: premex-ab/setup-android-cli@v1
        with:
          packages: |
            platforms/android-36
            build-tools/36.0.0
            platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :androidApp:assembleDebug

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/MangaDT-android-debug.apk
          sha256sum dist/MangaDT-android-debug.apk > dist/MangaDT-android-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangadt-android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux-deb:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot dpkg-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Linux installer
        run: ./gradlew --no-daemon --no-configuration-cache :desktopApp:packageDeb

      - name: Prepare Linux package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find desktopApp/build/compose/binaries/main/deb -type f -name '*.deb' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "Gradle finished without producing a DEB package." >&2
            find desktopApp/build/compose/binaries -maxdepth 6 -type f -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$package" dist/MangaDT-linux-amd64.deb
          sha256sum dist/MangaDT-linux-amd64.deb > dist/MangaDT-linux-amd64.deb.sha256

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangadt-linux-deb
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset 3 for jpackage
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
          $wix = Get-ChildItem -Path 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wix) {
            throw 'WiX Toolset v3 was not found after installation.'
          }
          $bin = Join-Path $wix.FullName 'bin'
          if (-not (Test-Path (Join-Path $bin 'candle.exe')) -or -not (Test-Path (Join-Path $bin 'light.exe'))) {
            throw "WiX compiler/linker not found in $bin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installer
        run: .\gradlew.bat --no-daemon --no-configuration-cache :desktopApp:packageMsi

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $package = Get-ChildItem 'desktopApp/build/compose/binaries/main/msi' -Filter '*.msi' -File |
            Select-Object -First 1
          if (-not $package) {
            Get-ChildItem 'desktopApp/build/compose/binaries' -Recurse -File | Select-Object -ExpandProperty FullName
            throw 'Gradle finished without producing an MSI package.'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $package.FullName 'dist/MangaDT-windows-x64.msi'
          $hash = (Get-FileHash 'dist/MangaDT-windows-x64.msi' -Algorithm SHA256).Hash.ToLower()
          "$hash  MangaDT-windows-x64.msi" | Set-Content 'dist/MangaDT-windows-x64.msi.sha256'

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangadt-windows-msi
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [android-apk, linux-deb, windows-msi]
    if: >-
      ${{
        success() &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.publish_release
          )
        )
      }}
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mangadt-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate checksums
        run: |
          set -euo pipefail
          test -s release-assets/MangaDT-android-debug.apk
          test -s release-assets/MangaDT-linux-amd64.deb
          test -s release-assets/MangaDT-windows-x64.msi
          cd release-assets
          sha256sum MangaDT-android-debug.apk MangaDT-linux-amd64.deb MangaDT-windows-x64.msi > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="MangaDT $GITHUB_REF_NAME"
          else
            tag="build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            title="MangaDT build $GITHUB_RUN_NUMBER"
          fi
          gh release create "$tag" release-assets/* \\
            --repo "$GITHUB_REPOSITORY" \\
            --title "$title" \\
            --target "$GITHUB_SHA" \\
            --notes "Automated builds for Android, Linux and Windows. Verify downloads using SHA256SUMS."
