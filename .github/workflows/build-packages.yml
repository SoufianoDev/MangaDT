name: Build Android, Linux and Windows packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish all built packages as a GitHub Release (run from main only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: premex-ab/setup-android-cli@v1
        with:
          packages: |
            platforms/android-36
            build-tools/36.0.0
            platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :androidApp:assembleDebug

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/MangaDT-android-debug.apk
          (cd dist && sha256sum MangaDT-android-debug.apk > MangaDT-android-debug.apk.sha256)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangadt-android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux-deb:
    name: Build Linux DEB and AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Debian packaging and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot dpkg-dev file patchelf desktop-file-utils

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Linux installer
        run: ./gradlew --no-daemon --no-configuration-cache :desktopApp:packageDeb

      - name: Prepare Linux DEB
        shell: bash
        run: |
          set -euo pipefail
          package="$(find desktopApp/build/compose/binaries/main/deb -type f -name '*.deb' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "Gradle finished without producing a DEB package." >&2
            find desktopApp/build/compose/binaries -maxdepth 6 -type f -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$package" dist/MangaDT-linux-amd64.deb
          (cd dist && sha256sum MangaDT-linux-amd64.deb > MangaDT-linux-amd64.deb.sha256)

      - name: Build AppImage from the packaged desktop application
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage-tools"
          appdir="$RUNNER_TEMP/MangaDT.AppDir"
          mkdir -p "$tools" "$appdir"

          # Reuse the same self-contained jpackage application image as the DEB.
          dpkg-deb --extract dist/MangaDT-linux-amd64.deb "$appdir"
          test -x "$appdir/opt/com.abht.manga-dt/bin/com.abht.manga_dt"
          test -f "$appdir/opt/com.abht.manga-dt/lib/runtime/release"

          cat > "$appdir/AppRun" <<'APP_RUN'
          #!/usr/bin/env sh
          set -eu
          : "${APPDIR:=$(dirname "$(readlink -f "$0")")}"
          exec "$APPDIR/opt/com.abht.manga-dt/bin/com.abht.manga_dt" "$@"
          APP_RUN
          chmod 755 "$appdir/AppRun"

          cat > "$appdir/mangadt.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=MangaDT
          Comment=Manga and comics reader
          Exec=AppRun
          Icon=mangadt
          Terminal=false
          Categories=Utility;Graphics;
          DESKTOP

          install -Dm644 androidApp/src/main/res/mipmap-xxxhdpi/ic_launcher.png "$appdir/mangadt.png"
          ln -sf mangadt.png "$appdir/.DirIcon"

          # Pin and verify the AppImage packaging toolchain.
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -o "$tools/linuxdeploy-x86_64.AppImage"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tools/linuxdeploy-x86_64.AppImage" | sha256sum --check
          chmod +x "$tools/linuxdeploy-x86_64.AppImage"

          APPIMAGE_EXTRACT_AND_RUN=1 "$tools/linuxdeploy-x86_64.AppImage" \
            --appdir "$appdir" \
            --executable "$appdir/opt/com.abht.manga-dt/bin/com.abht.manga_dt" \
            --desktop-file "$appdir/mangadt.desktop" \
            --icon-file "$appdir/mangadt.png"

          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o "$tools/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tools/appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x "$tools/appimagetool-x86_64.AppImage"

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 APPIMAGETOOL_APP_NAME=MangaDT \
            "$tools/appimagetool-x86_64.AppImage" "$appdir" "$PWD/dist/MangaDT-x86_64.AppImage"

          chmod +x dist/MangaDT-x86_64.AppImage
          file dist/MangaDT-x86_64.AppImage | grep -q 'ELF'
          test -s dist/MangaDT-x86_64.AppImage
          (cd dist && sha256sum MangaDT-x86_64.AppImage > MangaDT-x86_64.AppImage.sha256)

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: mangadt-linux-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows-packages:
    name: Build Windows MSI and EXE installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset 3 for jpackage
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
          $wix = Get-ChildItem -Path 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wix) {
            throw 'WiX Toolset v3 was not found after installation.'
          }
          $bin = Join-Path $wix.FullName 'bin'
          if (-not (Test-Path (Join-Path $bin 'candle.exe')) -or -not (Test-Path (Join-Path $bin 'light.exe'))) {
            throw "WiX compiler/linker not found in $bin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI and EXE installers
        run: .\gradlew.bat --no-daemon --no-configuration-cache :desktopApp:packageMsi :desktopApp:packageExe

      - name: Prepare Windows packages
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktopApp/build/compose/binaries/main/msi' -Filter '*.msi' -File |
            Select-Object -First 1
          $exe = Get-ChildItem 'desktopApp/build/compose/binaries/main/exe' -Filter '*.exe' -File |
            Select-Object -First 1

          if (-not $msi -or -not $exe) {
            Get-ChildItem 'desktopApp/build/compose/binaries' -Recurse -File | Select-Object -ExpandProperty FullName
            throw 'Gradle did not produce both MSI and EXE installers.'
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $msi.FullName 'dist/MangaDT-windows-x64.msi'
          Copy-Item $exe.FullName 'dist/MangaDT-windows-x64.exe'

          $msiHash = (Get-FileHash 'dist/MangaDT-windows-x64.msi' -Algorithm SHA256).Hash.ToLower()
          "$msiHash  MangaDT-windows-x64.msi" | Set-Content 'dist/MangaDT-windows-x64.msi.sha256'
          $exeHash = (Get-FileHash 'dist/MangaDT-windows-x64.exe' -Algorithm SHA256).Hash.ToLower()
          "$exeHash  MangaDT-windows-x64.exe" | Set-Content 'dist/MangaDT-windows-x64.exe.sha256'

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: mangadt-windows-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [android-apk, linux-deb, windows-packages]
    if: >-
      ${{
        success() &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.publish_release
          )
        )
      }}
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mangadt-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate checksums
        run: |
          set -euo pipefail
          test -s release-assets/MangaDT-android-debug.apk
          test -s release-assets/MangaDT-linux-amd64.deb
          test -s release-assets/MangaDT-x86_64.AppImage
          test -s release-assets/MangaDT-windows-x64.msi
          test -s release-assets/MangaDT-windows-x64.exe
          cd release-assets
          sha256sum \
            MangaDT-android-debug.apk \
            MangaDT-linux-amd64.deb \
            MangaDT-x86_64.AppImage \
            MangaDT-windows-x64.msi \
            MangaDT-windows-x64.exe > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="MangaDT $GITHUB_REF_NAME"
          else
            tag="build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            title="MangaDT build $GITHUB_RUN_NUMBER"
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --target "$GITHUB_SHA" \
            --notes "Automated Android, Linux, and Windows builds. Verify download files with SHA256SUMS."
