name: Deploy Kotlin/Wasm web app to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/Wasm distribution
        run: ./gradlew --no-daemon --no-configuration-cache :webApp:wasmJsBrowserDistribution

      - name: Verify generated website
        run: test -s webApp/build/dist/wasmJs/productionExecutable/index.html

      - name: Upload web distribution for deployment
        uses: actions/upload-artifact@v4
        with:
          name: mangadt-wasm-web
          path: webApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download web distribution
        uses: actions/download-artifact@v4
        with:
          name: mangadt-wasm-web
          path: web-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
